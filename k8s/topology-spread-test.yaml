apiVersion: v1
kind: Pod
metadata:
  name: topology-spread-test
  namespace: devops-learning
  labels:
    app: topology-demo
spec:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: topology-demo

  containers:
    - name: nginx
      image: nginx:1.27