apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-demo
  namespace: devops-learning
spec:
  serviceName: stateful-demo
  replicas: 3

  selector:
    matchLabels:
      app: stateful-demo

  template:
    metadata:
      labels:
        app: stateful-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27