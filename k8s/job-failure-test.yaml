apiVersion: batch/v1
kind: Job
metadata:
  name: job-failure-test
  namespace: devops-learning
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: job-failure-test
    spec:
      restartPolicy: Never
      containers:
        - name: task
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Starting failing job"
              echo "Something went wrong"
              exit 1