apiVersion: v1
kind: Pod
metadata:
  name: pod-preferred-affinity
  namespace: devops-learning
spec:
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: affinity-target
            topologyKey: kubernetes.io/hostname

  containers:
    - name: nginx
      image: nginx:1.27