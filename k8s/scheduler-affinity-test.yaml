apiVersion: v1
kind: Pod

metadata:
  name: scheduler-affinity-test
  namespace: devops-learning

spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: scheduler-demo
                operator: In
                values:
                  - "true"

  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Node affinity test"
          sleep 3600