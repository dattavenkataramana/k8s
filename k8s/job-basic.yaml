apiVersion: batch/v1
kind: Job
metadata:
  name: job-basic
  namespace: devops-learning
spec:
  template:
    metadata:
      labels:
        app: job-basic
    spec:
      restartPolicy: Never
      containers:
        - name: task
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Job started"
              echo "Doing work..."
              sleep 5
              echo "Job completed successfully"