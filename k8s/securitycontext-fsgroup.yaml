apiVersion: v1
kind: Pod
metadata:
  name: securitycontext-fsgroup
  namespace: devops-learning
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 2000

  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]

    volumeMounts:
    - name: data
      mountPath: /data

  volumes:
  - name: data
    emptyDir: {}